<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b172b"><title>Estudo do dia — Transpetro 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1628;color:#f4f7ff;font:14px system-ui,Arial,sans-serif}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px max(20px,calc((100vw - 1250px)/2));background:#0c1d35;border-bottom:1px solid #2e4566}.brand{font-weight:800;color:#ffc13c;font-size:17px}.back{background:#183353;color:#fff;text-decoration:none;border:1px solid #405977;border-radius:9px;padding:10px 15px}.layout{max-width:1250px;margin:24px auto;padding:0 18px}h1{margin:0 0 7px;font-size:25px}p{color:#a7bbd8;margin:0 0 15px}.stage{min-height:600px;border:1px solid #2b4769;border-radius:17px;background:#0e1f37;overflow:hidden}.stage iframe{display:block;width:100%;min-height:75vh;border:0}.error{padding:20px;color:#ffc13c}.hidden{display:none}@media(max-width:600px){.top{padding:12px}.layout{margin:14px auto}.stage iframe{min-height:83vh}h1{font-size:21px}}
@media(max-width:768px){.top{height:56px;padding:8px 12px}.brand{font-size:13px}.back{padding:8px 10px;font-size:12px}.layout{max-width:none;margin:0;padding:0}.layout>h1,.layout>p{display:none}.stage{border:0;border-radius:0;min-height:calc(100dvh - 56px)}.stage iframe{width:100%;height:calc(100dvh - 56px);min-height:0}} </style></head><body><header class="top"><div class="brand">⚓ Transpetro 2026 · Central de Estudos</div><a class="back" href="./index.html">← Voltar ao Dashboard</a></header><main class="layout"><h1 id="title">Estudo do dia</h1><p id="status">Carregando questões do calendário...</p><section class="stage"><iframe title="Questões do dia" id="study" src="./app-original.html?v=20261019-summaryfix5" allow="clipboard-write"></iframe><div id="error" class="error hidden"></div></section></main>
<script>
const params=new URLSearchParams(location.search),date=params.get('data')||'',title=document.getElementById('title'),status=document.getElementById('status'),frame=document.getElementById('study');
if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){status.textContent='Data inválida. Volte ao Dashboard e selecione um dia.';frame.style.display='none'}else{
const label=date.slice(8)+'/'+date.slice(5,7)+'/'+date.slice(0,4);title.textContent='Questões do dia — '+label;
let tries=0,done=false;
function initialize(){
 if(done)return;tries++;
 try{
  const w=frame.contentWindow,d=frame.contentDocument;
  const quiz=d&&d.getElementById('quizCard');
  if(quiz&&typeof w.openDate==='function'){
   done=true;
   const style=d.createElement('style');
   style.textContent='.app>section.card,.app>.hero,.app>.quickNav{display:none!important}#quizCard:not(.hidden),#summaryCard:not(.hidden){display:block!important}body{background:#0e1f37!important;color:#f5f8ff!important}.app{padding:14px!important;max-width:1200px!important;margin:0 auto!important}#quizCard{background:#14243b!important;border:1px solid #2f4c6b!important;color:#fff!important}#questionText,#qmeta{color:#f5f8ff!important}.option{background:#142943!important;color:#fff!important;border-color:#355477!important}.option:hover{border-color:#ffc13c!important}.btn.primary{background:#ffc13c!important;color:#182339!important}';
   d.head.appendChild(style);
   const responsive=d.createElement('style');responsive.textContent='html,body{width:100%!important;overflow-x:hidden!important}.app{width:100%!important;max-width:none!important;margin:0!important;padding:8px!important}#quizCard,#summaryCard{width:100%!important;max-width:none!important;margin:0!important;padding:12px!important}.question{font-size:17px!important;line-height:1.55!important}.options,.option{width:100%!important}.option{min-height:56px!important;overflow-wrap:anywhere!important} @media(max-width:768px){#quizCard{border-radius:10px!important}.nav{display:flex!important;flex-wrap:wrap!important;gap:8px!important}}';
   d.head.appendChild(responsive);
   const resultsTheme=d.createElement('style');resultsTheme.id='studyResultsDarkTheme';resultsTheme.textContent="#summaryCard,#summaryCard.summary,.summary,.summaryGrid,.themeGrid{background:#14243b!important;color:#f4f7ff!important}#summaryCard{border:1px solid #355477!important;border-radius:15px!important;padding:18px!important}#summaryCard h2,#summaryCard .big,#summaryPct,#summaryAnswered,#summaryCorrect,#summaryWrong{color:#ffca52!important}#summaryCard .summaryGrid>div,#summaryCard .themeItem,#themeSummary>div{background:#1a304e!important;color:#f4f7ff!important;border:1px solid #355477!important;border-radius:12px!important;padding:13px!important}#summaryCard .summaryGrid span,#summaryCard .small,#summaryCard p,#themeSummary{color:#c4d4ec!important}#summaryCard button{color:#f5f7ff!important;background:#244364!important;border:1px solid #446083!important}#summaryCard button.primary{color:#122138!important;background:#ffc13c!important}#quizCard .feedback,#quizCard .fullLesson,#quizCard .simpleLesson,#quizCard .whyBox,#quizCard .alert{background:#192f49!important;color:#eef5ff!important;border-color:#395b79!important}#quizCard .feedback b,#quizCard .fullLesson b,#quizCard .simpleLesson b{color:#ffcb60!important}#quizCard .feedback.good{border-color:#3a9c76!important}#quizCard .feedback.bad{border-color:#d66a6b!important}#quizCard .option.correct{background:#133b32!important;color:#eafff4!important;border-color:#40ad80!important}#quizCard .option.wrong{background:#42252b!important;color:#fff0ef!important;border-color:#d77979!important}@media(max-width:768px){#summaryCard{margin:0!important;width:100%!important}#summaryCard .summaryGrid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}#summaryCard .summaryGrid>div{min-width:0!important;text-align:center!important;padding:9px 4px!important}#summaryCard .themeGrid{grid-template-columns:1fr!important}#summaryCard .themeItem{overflow-wrap:anywhere!important}}";d.head.appendChild(resultsTheme);const summaryFix=d.createElement('style');summaryFix.textContent="#summaryCard,#summaryCard *{color:#f4f7ff!important}#summaryCard{background:#14243b!important;border:1px solid #3b587a!important}#summaryCard .big,#summaryCard #summaryPct,#summaryCard h2{color:#ffca52!important}#summaryCard .summaryGrid,#summaryCard .summaryGrid>div,#summaryCard .themeGrid,#summaryCard .themeItem,#summaryCard #themeSummary,#summaryCard #themeSummary>*{background:#19314e!important;border:1px solid #3a5678!important;color:#f4f7ff!important}#summaryCard .summaryGrid b,#summaryCard .themeGrid b{color:#ffca52!important}#summaryCard .small,#summaryCard span{color:#c8d9ec!important}#summaryCard .btn{background:#244365!important;color:#fff!important;border:1px solid #4b6888!important}#summaryCard .btn.primary{background:#ffbe3b!important;color:#152238!important}#summaryCard .summaryGrid>div,#summaryCard .themeItem{box-shadow:none!important}#quizCard .fullLesson,#quizCard .fullLesson p,#quizCard .feedback .fullLesson{background:#192f49!important;color:#f4f7ff!important}";d.head.appendChild(summaryFix);
   w.openDate(date);

   // Comentários de cada alternativa: renderizados diretamente na tela de estudo.
   const feedback=d.getElementById('feedback');
   const rationale={
    A:'Representa a falácia do custo irrecuperável: persistir numa decisão por recursos já investidos.',
    B:'Representa o efeito de enquadramento: a forma de apresentar opções influencia a escolha.',
    C:'Representa satisficing (solução satisfatória), um resultado possível da racionalidade limitada, não sua definição geral.',
    D:'É a definição de racionalidade limitada: decidir sob limites de informação, tempo e capacidade cognitiva.',
    E:'Representa o viés de ancoragem: peso excessivo à informação inicial.'
   };
   function renderComments(){
    if(!feedback||!feedback.textContent.trim())return;
    let q;try{q=w.eval('session[idx]')}catch(e){return}
    if(!q||!Array.isArray(q.options))return;
    const key=q.id+'|'+q.answer;
    const old=feedback.querySelector('[data-option-analysis]');
    if(old&&old.dataset.key===key)return;
    if(old)old.remove();
    const wrap=d.createElement('section');wrap.dataset.optionAnalysis='true';wrap.dataset.key=key;
    wrap.style.cssText='margin-top:15px;padding:13px;border-radius:12px;background:#12253b;color:#f5f8ff;border:1px solid #3b5678';
    const heading=d.createElement('h3');heading.textContent='Por que cada alternativa está certa ou errada?';heading.style.cssText='color:#ffca52;margin:0 0 12px;font-size:17px';wrap.appendChild(heading);
    q.options.forEach((option,i)=>{
      const letter='ABCDE'[i],correct=letter===q.answer;
      const item=d.createElement('div');item.style.cssText='padding:11px;margin:9px 0;border-radius:9px;background:'+(correct?'#133b33':'#182d49')+';border:1px solid '+(correct?'#3db281':'#3f5a7b');
      const t=d.createElement('strong');t.style.color=correct?'#6aefad':'#ffcb64';t.textContent=letter+' — '+(correct?'Correta':'Incorreta');item.appendChild(t);
      const statement=d.createElement('p');statement.textContent=option;statement.style.cssText='margin:6px 0;color:#fff';item.appendChild(statement);
      const explanation=d.createElement('p');explanation.style.cssText='margin:6px 0 0;color:#cbdaf0;line-height:1.5';
      const stored=q.optionExplanations||q.alternativeExplanations||{};
      const known=Array.isArray(stored)?stored[i]:stored[letter];
      const special=/Racionalidade limitada/i.test(q.question)&&q.options.some(x=>/restrições de informação, tempo e capacidade cognitiva/i.test(x));
      explanation.textContent=known||(special?rationale[letter]:(correct?(q.explanation||q.fullExplanation||'Gabarito indicado no banco; análise específica pendente.'):'Justificativa individual ainda não validada. Confira a definição do conceito na explicação principal.'));
      item.appendChild(explanation);wrap.appendChild(item);
    });
    feedback.appendChild(wrap);
   }
   if(feedback){new MutationObserver(()=>{if(!feedback.querySelector('[data-option-analysis]'))renderComments()}).observe(feedback,{childList:true});setTimeout(renderComments,50)}


   // Reconstroi a apresentação dos dados reais do resumo, sem modificar respostas.
   const summary=d.getElementById('summaryCard');
   function refreshSummary(){
     if(!summary||summary.classList.contains('hidden'))return;
     summary.style.setProperty('background','#14243b','important');
     summary.style.setProperty('color','#f4f7ff','important');
     for(const id of ['summaryAnswered','summaryCorrect','summaryWrong','summaryPct']){
       const el=d.getElementById(id);if(el){el.style.setProperty('color','#ffcb52','important');el.style.setProperty('visibility','visible','important');el.style.setProperty('opacity','1','important');}
     }
     const grid=summary.querySelector('.summaryGrid');
     if(grid)for(const cell of grid.children){
       cell.style.setProperty('background','#1b3451','important');
       cell.style.setProperty('color','#f4f7ff','important');
       cell.style.setProperty('border','1px solid #3b5b7c','important');
       for(const el of cell.querySelectorAll('*')){el.style.setProperty('color',el.tagName==='B'?'#ffcb52':'#ecf4ff','important');el.style.setProperty('visibility','visible','important');}
     }
     const themes=d.getElementById('themeSummary');
     if(themes)for(const cell of themes.children){
       cell.style.setProperty('background','#1b3451','important');
       cell.style.setProperty('color','#f4f7ff','important');
       cell.style.setProperty('border','1px solid #3b5b7c','important');
       for(const el of cell.querySelectorAll('*'))el.style.setProperty('color','#f4f7ff','important');
     }
     if(!summary.querySelector('#studySummaryLabels')){
       const heading=d.createElement('div');heading.id='studySummaryLabels';
       heading.textContent='Resultado do bloco: respostas, acertos, erros e aproveitamento por matéria.';
       heading.style.cssText='color:#c9d9ef;margin:12px 0;font-size:13px';
       (grid||summary).before(heading);
     }
   }
   if(summary){new MutationObserver(refreshSummary).observe(summary,{attributes:true,attributeFilter:['class']});setTimeout(refreshSummary,300);}

   status.textContent='Bloco do dia carregado. Seu progresso continua salvo no aplicativo.';
   try{w.scrollTo(0,0)}catch(e){}
   return;
  }
 }catch(e){console.warn('Carregando banco de questões',e)}
 if(tries<100)setTimeout(initialize,300);
 else{status.textContent='O banco demorou para carregar. Atualize a página e tente novamente.';}
}
frame.addEventListener('load',initialize);setTimeout(initialize,300);
}
</script></body></html>
