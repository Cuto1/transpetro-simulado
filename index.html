<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163f5c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<title>Transpetro — Reta Final</title>
<style>
body{margin:0;background:#f2f6f8;color:#163f5c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}
.box{text-align:center;padding:28px}.spin{width:44px;height:44px;border:5px solid #d8e5ec;border-top-color:#163f5c;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}small{color:#667784}
</style>
</head>
<body><div class="box"><div class="spin"></div><b>Carregando Simulado Transpetro…</b><br><small>Preparando suas 2.550 questões</small></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
(async()=>{
 try{
   let h="";
   for(let i=0;i<16;i++){
     const r=await fetch("./data/p"+String(i).padStart(2,"0")+".txt",{cache:"no-cache"});
     if(!r.ok) throw new Error("parte "+i);
     h+=await r.text();
   }
   h=h.replace('</body>','<script src="https://koracudeysqpanhjgmfm.supabase.co/functions/v1/transpetro-cloud-client"></'+'script></body>'); document.open(); document.write(h); document.close();
 }catch(e){
   document.body.innerHTML='<div class="box"><b>Não foi possível carregar o simulador.</b><br><small>Atualize a página em alguns segundos.</small></div>';
 }
})();
</script></body></html>
